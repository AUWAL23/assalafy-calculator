name: Build ASSALAFY Calculator APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

  - name: Install Python tools
    run: |
      python3 -m venv .venv
      .venv/bin/python -m pip install --upgrade pip setuptools wheel
      .venv/bin/python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

  - name: Build Android APK
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PIP_USER: "false"
    run: |
      source .venv/bin/activate
      export PATH="$VIRTUAL_ENV/bin:$PATH"
      buildozer -v android debug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: ASSALAFY-Calculator-APK
      path: bin/*.apk
      if-no-files-found: error
